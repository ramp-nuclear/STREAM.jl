<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14">
  <rect width="640" height="400" fill="white"/>
  <!-- axes -->
  <line x1="70" y1="340" x2="610" y2="340" stroke="#333" stroke-width="1.5"/>
  <line x1="70" y1="340" x2="70" y2="30" stroke="#333" stroke-width="1.5"/>
  <text x="600" y="368" text-anchor="end">mass flow ṁ</text>
  <text x="30" y="40" transform="rotate(-90 30 40)" text-anchor="end">pressure drop Δp</text>
  <!-- single-phase curve, Δp ∝ ṁ² -->
  <path d="M 70 335 Q 330 320 600 70" fill="none" stroke="#9aa" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="470" y="100" fill="#699">single phase only</text>
  <!-- heated channel demand curve: S-shape -->
  <path d="M 85 120 C 120 60, 170 60, 215 130 C 260 205, 300 255, 360 248 C 430 240, 520 160, 600 70"
        fill="none" stroke="#1f6fb4" stroke-width="3"/>
  <text x="120" y="52" fill="#1f6fb4">heated channel, fixed power</text>
  <!-- minimum (OFI) -->
  <circle cx="352" cy="249" r="6" fill="#d9480f"/>
  <text x="352" y="280" text-anchor="middle" fill="#d9480f">OFI: the minimum</text>
  <!-- flat supply curve -->
  <line x1="70" y1="190" x2="610" y2="190" stroke="#2b8a3e" stroke-width="2"/>
  <text x="608" y="182" text-anchor="end" fill="#2b8a3e">supply: fixed Δp across parallel channels</text>
  <!-- intersections -->
  <circle cx="497" cy="190" r="5" fill="#2b8a3e"/>
  <circle cx="246" cy="190" r="5" fill="none" stroke="#2b8a3e" stroke-width="2"/>
  <circle cx="153" cy="190" r="5" fill="#2b8a3e"/>
  <text x="497" y="212" text-anchor="middle" font-size="12">stable</text>
  <text x="246" y="212" text-anchor="middle" font-size="12">unstable</text>
  <text x="153" y="212" text-anchor="middle" font-size="12">stable, low flow</text>
  <!-- unstable region shading label -->
  <text x="290" y="320" text-anchor="middle" font-size="12" fill="#555">slope &lt; 0: Δp rises as ṁ falls</text>
  <text x="620" y="395" text-anchor="end" font-size="11" fill="#888">schematic, not to scale</text>
</svg>
