name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
# Nothing here writes to the repository. The coverage upload authenticates with its own token.
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  # Reproducible gate: latest 1.x Julia against the committed Manifest.toml (exact pinned packages),
  # so the package set is fixed while the Julia version tracks the current release.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      # julia-runtest already runs with coverage on. These turn its .cov files into lcov.info and
      # upload it. Pull requests from forks get no secrets and upload without the token, which
      # Codecov accepts for a public repository.
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # Forward-looking canary: latest Julia, and it drops the Manifest to resolve the latest compatible
  # packages, so an upstream bump that breaks the suite shows up here instead of on a contributor's
  # machine. Allowed to fail (continue-on-error) because a genuine upstream regression is outside our
  # control; it surfaces as a visible red mark without blocking unrelated PRs.
  test-latest:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Resolve latest compatible versions
        run: julia --project=. -e 'rm("Manifest.toml"; force=true); using Pkg; Pkg.instantiate()'
      - uses: julia-actions/julia-runtest@v1
